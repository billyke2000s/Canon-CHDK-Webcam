[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "canon-chdk-webcam"
version = "0.2.0"
description = "Experimental Canon IXUS 117 HS CHDK USB webcam host tooling"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Canon CHDK Webcam contributors"}]

[project.optional-dependencies]
usb = ["pyusb>=1.3,<2", "libusb-package>=1.0.26.4,<2"]
media = ["numpy>=2.2,<3", "av>=14,<20"]
webcam = ["numpy>=2.2,<3", "pyvirtualcam>=0.14,<1"]
gui = ["pillow>=12.2,<13"]
desktop = ["numpy>=2.2,<3", "av>=14,<20", "pillow>=12.2,<13", "pyusb>=1.3,<2", "libusb-package>=1.0.26.4,<2", "pyvirtualcam>=0.14,<1"]

[project.scripts]
canon-webcam-config = "canon_webcam.cli:main"
canon-webcam-simulate = "canon_webcam.simulator:main"
canon-webcam-inspect = "canon_webcam.inspect:main"
canon-webcam-benchmark = "canon_webcam.benchmark:main"

[project.gui-scripts]
canon-webcam = "canon_webcam.gui:main"

[tool.setuptools.packages.find]
include = ["canon_webcam*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
